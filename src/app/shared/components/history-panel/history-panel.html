<section class="flex flex-col gap-3" aria-labelledby="history-title">
  <h2 id="history-title" class="text-lg font-bold" i18n>Actividad reciente</h2>

  <mat-button-toggle-group
    aria-label="Filtrar historial"
    i18n-aria-label
    [value]="filter()"
    (change)="setFilter($event.value)"
  >
    @for (option of filters; track option.value) {
      <mat-button-toggle [value]="option.value">{{ option.label }}</mat-button-toggle>
    }
  </mat-button-toggle-group>

  @if (isEmpty()) {
    <p class="rounded-md border border-gray-200 p-4 text-gray-700" i18n>
      Aún no hay transferencias
    </p>
  } @else if (visible().length > 0) {
    <app-history-list
      [entries]="visible()"
      [shareAvailable]="shareAvailable"
      (exportEntry)="exportEntry($event)"
      (shareEntry)="shareEntry($event)"
      (removeEntry)="removeEntry($event)"
    />
  } @else if (loaded()) {
    <p class="rounded-md border border-gray-200 p-4 text-gray-700" i18n>
      No hay transferencias en este filtro
    </p>
  }
</section>
