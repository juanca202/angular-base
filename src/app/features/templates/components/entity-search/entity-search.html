<form class="ft-searchbox" novalidate>
  <ft-icon name="search" class="text-2xl" />
  <input type="search" i18n-placeholder placeholder="Search" [formField]="searchForm.query" />
</form>
<div mat-dialog-content class="p-2!">
  <div class="ft-list">
    @if (entities.loading()) {
      @for (entity of [1, 2, 3, 4, 5]; track $index) {
        <div class="ft-list__item">
          <div class="flex gap-4 items-center">
            <div class="ft-ph" style="width: 40px; height: 40px; border-radius: 100vh"></div>
            <div class="grow">
              <div
                class="ft-ph"
                [style.width.px]="layoutManager.getRandomNumber(160, 200)"
                style="height: 21px"
              ></div>
            </div>
          </div>
        </div>
      }
    } @else if (entities.error()) {
      <app-error-placeholder class="ft-center" [resource]="entities" />
    } @else if (!entities.value()?.length) {
      <div class="ft-center" i18n>No records</div>
    } @else {
      @for (entity of entities.value(); track entity.id) {
        <button type="button" class="ft-list__item" matButton (click)="select(entity)">
          <div class="flex gap-4 items-center">
            <ft-avatar
              [label]="`${entity.firstName} ${entity.lastName}`"
              style="--ft-avatar-size: 40px"
            />
            <div class="grow">{{ entity.firstName }} {{ entity.lastName }}</div>
          </div>
        </button>
      }
    }
  </div>
</div>
