<form novalidate (submit)="onSubmit($event)">
  <div mat-dialog-title>
    <div i18n>Forgot your password?</div>
  </div>
  <div mat-dialog-content class="pb-0">
    <p class="mb-4" i18n>
      Enter your email address to recieve reset instructions. You may need to check your spam
      folder.
    </p>
    <div class="grid grid-cols-1 gap-y-2 gap-x-4">
      <mat-form-field>
        <mat-label i18n>Email address</mat-label>
        <input type="email" matInput [formField]="forgotForm.email" />
        @if (forgotForm.email().touched() && forgotForm.email().invalid()) {
          <mat-error>{{ forgotForm.email().errors()[0]?.message }}</mat-error>
        }
      </mat-form-field>
    </div>
  </div>
  <div mat-dialog-actions>
    <button type="button" matButton="outlined" [disabled]="submitting()" mat-dialog-close i18n>
      Cancel
    </button>
    <button type="submit" matButton="filled" color="primary" [disabled]="submitting()">
      @if (!submitting()) {
        <span i18n>Submit</span>
      } @else {
        <ng-container *ngTemplateOutlet="submittingTemplate" />
      }
    </button>
  </div>
</form>
<ng-template #submittingTemplate>
  <div class="text-center">
    <ft-progress class="ft-progress--2" />
  </div>
</ng-template>
