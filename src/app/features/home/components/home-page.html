<header class="flex min-h-14 items-center justify-center gap-2 border-b border-gray-200 bg-white">
  <img ngSrc="icons/logo.svg" width="32" height="32" alt="" />
  <span class="text-xl font-bold" i18n>QRTransfer</span>
</header>

<section class="mx-auto flex w-full max-w-3xl flex-col gap-6 px-4 py-6">
  <h1 class="sr-only" i18n>Inicio</h1>

  <nav
    class="grid grid-cols-1 gap-4 md:grid-cols-2"
    aria-label="Acciones principales"
    i18n-aria-label
  >
    <a routerLink="/enviar" class="text-gray-900 no-underline">
      <mat-card appearance="outlined" class="flex flex-col gap-3 p-5 hover:bg-gray-50">
        <span class="grid size-12 place-items-center rounded-full bg-blue-100">
          <ft-icon name="upload" aria-hidden="true" class="text-2xl" />
        </span>
        <span class="text-lg font-bold" i18n>Enviar</span>
        <span class="text-sm text-gray-700" i18n>Transfiere archivos mediante QR</span>
      </mat-card>
    </a>
    <a routerLink="/recibir" class="text-gray-900 no-underline">
      <mat-card appearance="outlined" class="flex flex-col gap-3 p-5 hover:bg-gray-50">
        <span class="grid size-12 place-items-center rounded-full bg-green-100">
          <ft-icon name="download" aria-hidden="true" class="text-2xl" />
        </span>
        <span class="text-lg font-bold" i18n>Recibir</span>
        <span class="text-sm text-gray-700" i18n>Escanea código QR para recibir datos</span>
      </mat-card>
    </a>
  </nav>

  <app-history-panel />
</section>

<router-outlet (deactivate)="refreshHistory()" />
