<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" font-family="sans-serif" font-size="14">
  <rect width="1280" height="800" fill="#fafafa"/><rect width="1280" height="64" fill="#e0e0e0"/>
  <text x="32" y="40" font-size="20" font-weight="bold" fill="#222">Resultado de la transferencia</text>
  <g stroke="#999" fill="#ececec"><rect x="140" y="110" width="300" height="200" rx="8"/><rect x="490" y="110" width="300" height="200" rx="8"/><rect x="840" y="110" width="300" height="200" rx="8"/><rect x="140" y="340" width="650" height="170" rx="8"/></g>
  <g fill="#333"><text x="160" y="146" font-size="18" font-weight="bold">Incompleta</text><text x="160" y="176">Faltan fragmentos del archivo.</text><text x="160" y="270">Botón: Seguir escaneando</text>
  <text x="510" y="146" font-size="18" font-weight="bold">Datos inválidos</text><text x="510" y="176">Falló la verificación de integridad.</text><text x="510" y="270">Botón: Reintentar</text>
  <text x="860" y="146" font-size="18" font-weight="bold">No reconstruible</text><text x="860" y="176">No se pudo armar el archivo.</text><text x="860" y="270">Botón: Reintentar</text></g>
  <g fill="#333"><text x="160" y="376" font-size="18" font-weight="bold">Almacenamiento lleno</text><text x="160" y="406">Recepción completa y verificada, pero no hay espacio para guardarla.</text><text x="160" y="430">No se guarda ni se registra en el historial.</text><text x="160" y="480">Botón: Descargar archivo</text><text x="400" y="480">Botón: Reintentar</text></g>
  <text x="140" y="560" fill="#777">Ningún archivo se guarda en estos cuatro casos. Debajo aparece el historial, igual que en el resultado exitoso.</text>
</svg>
